<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procedure penale — Edouard Verny</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #1e1e2e; color: #cdd6f4;
    display: flex; height: 100vh; overflow: hidden;
  }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: #181825; }
  ::-webkit-scrollbar-thumb { background: #45475a; border-radius: 4px; }

  .sidebar {
    position: fixed; top: 0; left: 0; bottom: 0;
    width: 280px; max-width: 85vw;
    background: #181825; border-right: 1px solid #313244;
    display: flex; flex-direction: column;
    z-index: 1001; overflow: hidden;
    transform: translateX(0);
    transition: transform 0.25s ease;
  }
  .sidebar.closed { transform: translateX(-100%); }
  .sidebar h2 {
    font-size: 14px; padding: 16px 16px 12px;
    color: #89b4fa; border-bottom: 1px solid #313244;
    display: flex; justify-content: space-between; align-items: center;
  }
  .sidebar-list { flex: 1; overflow-y: auto; }
  .sidebar-item {
    padding: 10px 16px; cursor: pointer; border-bottom: 1px solid #232536;
    transition: background 0.2s; font-size: 13px;
  }
  .sidebar-item:hover { background: #313244; }
  .sidebar-item.active { background: #2a3b5c; border-left: 3px solid #89b4fa; }
  .sidebar-item .lesson-label { color: #89b4fa; font-weight: 600; font-size: 11px; }
  .sidebar-item .sub-label { color: #a6adc8; font-size: 12px; margin-top: 2px; }

  .sidebar-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.5); z-index: 1000;
  }
  .sidebar-overlay.show { display: block; }

  .main {
    flex: 1; display: flex; flex-direction: column; overflow-y: auto;
    min-width: 0; width: 100%;
  }
  .container { max-width: 820px; margin: 0 auto; padding: 24px; width: 100%; }

  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .header h1 { font-size: 20px; color: #89b4fa; }
  .header-controls { display: flex; align-items: center; gap: 10px; }
  .server-status { font-size: 11px; color: #585b70; }
  .btn-icon {
    background: none; border: 1px solid #45475a; color: #a6adc8;
    cursor: pointer; padding: 4px 10px; border-radius: 4px;
    font-size: 14px; transition: all 0.2s;
  }
  .btn-icon:hover { background: #313244; color: #cdd6f4; }
  hr { border: none; border-top: 1px solid #313244; margin: 12px 0 16px; }

  .lesson-info { text-align: center; margin-bottom: 12px; }
  .lesson-info .icon { font-size: 48px; display: block; margin-bottom: 6px; }
  .lesson-info .lesson-num { color: #a6adc8; font-size: 13px; }
  .lesson-info .lesson-title { color: #cdd6f4; font-size: 18px; font-weight: 700; margin: 4px 0; }
  .lesson-info .sub-title { color: #a6adc8; font-size: 14px; }
  .lesson-info .progress-text { color: #6c7086; font-size: 12px; margin-top: 4px; }

  .player audio {
    width: 100%; height: 44px; border-radius: 8px;
  }
  .player audio::-webkit-media-controls-panel { background: #181825; }
  .player audio::-webkit-media-controls-enclosure { border-radius: 8px; }

  .section {
    background: #181825; border: 1px solid #313244; border-radius: 12px;
    padding: 16px 20px; margin: 12px 0;
  }
  .section-title { font-weight: 700; margin-bottom: 10px; color: #89b4fa; font-size: 14px; }

  .quiz-section { display: none; }
  .question-text { font-size: 14px; margin-bottom: 10px; line-height: 1.5; }
  .quiz-section textarea {
    width: 100%; height: 90px; padding: 10px; border-radius: 8px;
    border: 1px solid #45475a; background: #313244; color: #cdd6f4;
    font-family: inherit; font-size: 16px; resize: vertical; outline: none;
  }
  .quiz-section textarea:focus { border-color: #89b4fa; }
  .btn {
    padding: 8px 20px; border: none; border-radius: 8px; cursor: pointer;
    font-size: 13px; font-weight: 600; transition: all 0.2s;
    background: #89b4fa; color: #1e1e2e;
  }
  .btn:hover { filter: brightness(1.1); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-secondary { background: #45475a; color: #cdd6f4; }
  .btn-success { background: #2e7d32; color: #fff; }
  .btn-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

  .chat-box {
    height: 140px; overflow-y: auto; background: #11111b;
    border-radius: 8px; padding: 10px; margin-bottom: 8px;
    font-size: 13px; line-height: 1.5; border: 1px solid #313244;
  }
  .chat-box .msg-user { color: #a6adc8; margin-bottom: 6px; }
  .chat-box .msg-bot { color: #89b4fa; margin-bottom: 10px; }
  .chat-input-row { display: flex; gap: 8px; }
  .chat-input-row textarea {
    flex: 1; height: 50px; padding: 8px; border-radius: 8px;
    border: 1px solid #45475a; background: #313244; color: #cdd6f4;
    font-family: inherit; font-size: 13px; resize: none; outline: none;
  }
  .chat-input-row textarea:focus { border-color: #89b4fa; }

  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    justify-content: center; align-items: center; z-index: 1002;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: #1e1e2e; border: 1px solid #45475a; border-radius: 16px;
    padding: 28px; max-width: 520px; width: 90%; max-height: 80vh; overflow-y: auto;
  }
  .modal h2 { font-size: 18px; margin-bottom: 12px; }
  .modal .feedback {
    background: #11111b; border-radius: 8px; padding: 12px;
    font-size: 13px; line-height: 1.5; margin: 12px 0; max-height: 200px;
    overflow-y: auto; white-space: pre-wrap;
  }
  .modal .btn-row { justify-content: center; }

  .certificate { text-align: center; padding: 20px; line-height: 1.8; }
  .certificate h2 { font-size: 24px; color: #f9e2af; margin-bottom: 16px; }
  .certificate p { font-size: 14px; color: #a6adc8; }
  .certificate .sub-list { text-align: left; display: inline-block; margin: 12px 0; }

  .status-bar {
    background: #11111b; padding: 8px 16px; font-size: 12px; color: #6c7086;
    border-top: 1px solid #313244; display: flex; justify-content: space-between;
  }
  .passed-badge { color: #2e7d32; font-size: 11px; margin-left: 4px; }
  .hidden { display: none !important; }

  .register-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    display: flex; justify-content: center; align-items: center; z-index: 2000;
  }
  .register-overlay.hidden { display: none !important; }
  .register-card {
    background: #1e1e2e; border: 1px solid #45475a; border-radius: 16px;
    padding: 36px 32px; max-width: 420px; width: 90%; text-align: center;
  }
  .register-card h2 { color: #89b4fa; font-size: 22px; margin-bottom: 8px; }
  .register-card p { color: #a6adc8; font-size: 13px; margin-bottom: 20px; }
  .register-card label { display: block; text-align: left; color: #a6adc8; font-size: 12px; margin-bottom: 4px; margin-top: 12px; }
  .register-card input {
    width: 100%; padding: 10px 12px; border-radius: 8px;
    border: 1px solid #45475a; background: #313244; color: #cdd6f4;
    font-size: 15px; outline: none; font-family: inherit;
  }
  .register-card input:focus { border-color: #89b4fa; }
  .register-card .btn { margin-top: 20px; width: 100%; padding: 12px; font-size: 15px; }

  @media print {
    body { background: #fff !important; color: #000 !important; }
    .sidebar, .sidebar-overlay, .header, hr, .player, .quiz-section,
    #chat-section, .status-bar, .menu-btn { display: none !important; }
    .main { overflow: visible !important; height: auto !important; }
    .container { max-width: 100% !important; padding: 0 !important; margin: 0 !important; }
    .modal-overlay { position: static !important; background: none !important; display: block !important; }
    .modal { border: none !important; box-shadow: none !important; max-width: 100% !important; width: 100% !important; padding: 40px !important; }
    .certificate h2 { color: #1a1a2e !important; }
    .certificate p { color: #333 !important; }
    .certificate .student-name { color: #000 !important; font-size: 18px; }
    .btn-row { display: none !important; }
  }

  .menu-btn {
    display: none; background: none; border: none; color: #cdd6f4;
    font-size: 24px; cursor: pointer; padding: 4px 8px;
  }
  .sidebar-close { display: none; }

  @media (max-width: 768px) {
    .menu-btn { display: inline-flex; align-items: center; }
    .sidebar-close { display: inline-flex; background: none; border: none; color: #a6adc8; font-size: 20px; cursor: pointer; }
    .sidebar.closed { transform: translateX(-100%); }
    .container { padding: 16px; }
    .header h1 { font-size: 16px; }
    .lesson-info .icon { font-size: 36px; }
    .lesson-info .lesson-title { font-size: 15px; }
    .section { padding: 12px 14px; }
    .btn { padding: 10px 20px; font-size: 14px; }
    .modal { padding: 20px; }
  }
</style>
</head>
<body>

<div class="sidebar" id="sidebar">
  <h2>Sommaire <button class="sidebar-close" id="sidebar-close">&times;</button></h2>
  <div class="sidebar-list" id="sidebar-list"></div>
</div>
<div class="sidebar-overlay" id="sidebar-overlay"></div>

<div class="main">
  <div class="container">
    <div class="header">
      <button class="menu-btn" id="menu-btn">&#9776;</button>
      <h1>Procedure penale</h1>
      <div class="header-controls">
        <span class="server-status" id="server-status"></span>
        <button class="btn-icon" id="fullscreen-btn">[]</button>
      </div>
    </div>
    <hr>

    <div class="lesson-info" id="lesson-info">
      <span class="icon">B</span>
      <div class="lesson-num" id="lesson-num"></div>
      <div class="lesson-title" id="lesson-title"></div>
      <div class="sub-title" id="sub-title"></div>
      <div class="progress-text" id="progress-text"></div>
    </div>

    <div class="player">
      <audio id="audio-player" controls preload="auto"></audio>
      <div style="text-align:center;margin-top:6px;display:flex;gap:8px;justify-content:center">
        <button class="btn btn-secondary" id="prev-btn">Precedent</button>
        <button class="btn btn-secondary" id="next-btn">Suivant</button>
      </div>
    </div>

    <div class="section quiz-section" id="quiz-section">
      <div class="section-title">Question</div>
      <div class="question-text" id="question-text"></div>
      <textarea id="answer-input" placeholder="Ecrivez votre reponse ici..."></textarea>
      <div class="btn-row">
        <button class="btn" id="submit-btn">Soumettre</button>
      </div>
    </div>

    <div class="section" id="chat-section">
      <div class="section-title">Posez une question sur la lecon</div>
      <div class="chat-box" id="chat-box"></div>
      <div class="chat-input-row">
        <textarea id="chat-input" placeholder="Posez votre question..."></textarea>
        <button class="btn" id="send-btn">Envoyer</button>
      </div>
    </div>
  </div>

  <div class="status-bar">
    <span id="status-text">Pret</span>
    <span id="status-progress"></span>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal-content"></div>
</div>

<div class="register-overlay" id="register-overlay">
  <div class="register-card">
    <h2>Inscription</h2>
    <p>Veuillez entrer votre nom et prenom avant de commencer la lecon.</p>
    <label>Nom</label>
    <input type="text" id="reg-name" placeholder="Votre nom" autocomplete="family-name">
    <label>Prenom</label>
    <input type="text" id="reg-prename" placeholder="Votre prenom" autocomplete="given-name">
    <button class="btn" id="reg-submit">Commencer la lecon</button>
  </div>
</div>

<script>
// ---- localStorage helpers ----
const LS_KEY = 'flask_lesson_state';

function loadState() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* ignore */ }
  return null;
}

function saveState(state) {
  localStorage.setItem(LS_KEY, JSON.stringify(state));
}

function clearState() {
  localStorage.removeItem(LS_KEY);
}

function getStudentName() {
  const s = loadState();
  return s ? `${s.prename || ''} ${s.name || ''}`.trim() : '';
}

async function restoreSessionToServer(state) {
  await fetch('/api/restore', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      lesson_idx: state.lesson_idx,
      sub_idx: state.sub_idx,
      passed: state.passed,
    })
  });
}

// ---- DOM refs ----
const audio = document.getElementById('audio-player');

// ---- auto-restore session before API calls ----
async function ensureSession() {
  const s = loadState();
  if (s) {
    await fetch('/api/restore', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        lesson_idx: s.lesson_idx,
        sub_idx: s.sub_idx,
        passed: s.passed,
      })
    });
  }
}
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');
const quizSection = document.getElementById('quiz-section');
const questionText = document.getElementById('question-text');
const answerInput = document.getElementById('answer-input');
const submitBtn = document.getElementById('submit-btn');
const chatBox = document.getElementById('chat-box');
const chatInput = document.getElementById('chat-input');
const sendBtn = document.getElementById('send-btn');
const modalOverlay = document.getElementById('modal-overlay');
const modalContent = document.getElementById('modal-content');
const registerOverlay = document.getElementById('register-overlay');
const regName = document.getElementById('reg-name');
const regPrename = document.getElementById('reg-prename');
const regSubmit = document.getElementById('reg-submit');

let currentLesson = null;
let quizPassed = false;

// ---- initialisation ----
async function init() {
  const saved = loadState();
  if (saved && saved.name && saved.prename) {
    await restoreSessionToServer(saved);
    registerOverlay.classList.add('hidden');
    loadLesson();
  } else {
    registerOverlay.classList.remove('hidden');
  }
}

regSubmit.onclick = async () => {
  const name = regName.value.trim();
  const prename = regPrename.value.trim();
  if (!name || !prename) { alert('Veuillez entrer votre nom et prenom.'); return; }
  regSubmit.disabled = true;
  regSubmit.textContent = 'Enregistrement...';
  const state = { lesson_idx: 0, sub_idx: 0, passed: [], name, prename };
  saveState(state);
  await restoreSessionToServer(state);
  regSubmit.disabled = false;
  regSubmit.textContent = 'Commencer la lecon';
  registerOverlay.classList.add('hidden');
  loadLesson();
};

regPrename.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') regSubmit.click();
});

// ---- lesson loading ----
async function loadLesson() {
  await ensureSession();
  const res = await fetch('/api/lesson');
  const data = await res.json();
  currentLesson = data;
  quizPassed = data.is_passed;

  document.getElementById('lesson-num').textContent =
    `Lecon ${data.lesson_num} / ${data.total_lessons}`;
  document.getElementById('lesson-title').textContent = data.lesson_title;
  document.getElementById('sub-title').textContent =
    `Sous-lecon ${data.sub_num} / ${data.sub_count} (${data.running_total} / ${data.total_sub} au total)`;
  document.getElementById('progress-text').textContent = quizPassed ? 'Deja reussi' : '';

  audio.src = `/audio/lesson_${data.lesson_idx}_${data.sub_idx}.mp3`;
  audio.load();

  quizSection.style.display = 'none';
  questionText.textContent = '';
  answerInput.value = '';

  document.getElementById('status-text').textContent = quizPassed
    ? `(deja reussi) ${data.sub_title}`
    : `${data.sub_title}`;
  document.getElementById('status-progress').textContent =
    `${data.running_total} / ${data.total_sub}`;

  renderSidebar();
}

audio.onended = () => {
  if (!quizPassed) {
    quizSection.style.display = 'block';
    questionText.textContent = currentLesson.question.q;
    document.getElementById('status-text').textContent = 'Repondez au quiz';
  }
};

audio.onloadedmetadata = () => {
  document.getElementById('status-text').textContent = 'Lecture disponible';
};

// ---- sidebar ----
async function renderSidebar() {
  const s = loadState();
  const passedParam = s && s.passed ? `?passed=${encodeURIComponent(JSON.stringify(s.passed))}` : '';
  const res = await fetch(`/api/sub-lessons${passedParam}`);
  const list = await res.json();
  const el = document.getElementById('sidebar-list');
  el.innerHTML = list.map((item, i) => `
    <div class="sidebar-item${item.lesson_idx === currentLesson?.lesson_idx && item.sub_idx === currentLesson?.sub_idx ? ' active' : ''}"
         onclick="navigateTo(${item.lesson_idx}, ${item.sub_idx})">
      <div class="lesson-label">${item.lesson_title}</div>
      <div class="sub-label">${item.sub_title}${item.passed ? ' (OK)' : ''}</div>
    </div>
  `).join('');
}

async function navigateTo(li, si) {
  const res = await fetch('/api/navigate', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({direction: 'goto', lesson_idx: li, sub_idx: si})
  });
  if (!res.ok) return alert('Vous devez reussir le quiz avant.');
  const data = await res.json();
  persistNavPosition(data);
  await loadLesson();
}

prevBtn.onclick = async () => {
  const res = await fetch('/api/navigate', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({direction: 'prev'})
  });
  if (!res.ok) return;
  const data = await res.json();
  persistNavPosition(data);
  await loadLesson();
};

nextBtn.onclick = async () => {
  const res = await fetch('/api/navigate', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({direction: 'next'})
  });
  if (!res.ok) {
    const err = await res.json();
    alert(err.reason || 'Bloque');
    return;
  }
  const data = await res.json();
  if (data.done) { showCertificate(); return; }
  persistNavPosition(data);
  await loadLesson();
};

function persistNavPosition(data) {
  const s = loadState();
  if (s) {
    s.lesson_idx = data.lesson_idx;
    s.sub_idx = data.sub_idx;
    saveState(s);
  }
}

// ---- quiz ----
submitBtn.onclick = async () => {
  const answer = answerInput.value.trim();
  if (!answer) return alert('Ecrivez une reponse.');

  submitBtn.disabled = true;
  submitBtn.textContent = 'Correction...';

  const res = await fetch('/api/evaluate', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({answer})
  });
  const data = await res.json();
  submitBtn.disabled = false;
  submitBtn.textContent = 'Soumettre';
  showResult(data);
};

function showResult(data) {
  quizPassed = data.passed;
  modalContent.innerHTML = `
    <h2 style="color:${data.passed ? '#2e7d32' : '#c62828'}">
      ${data.passed ? 'Bravo ! ' : 'Insuffisant : '} ${data.score}/10
    </h2>
    <div class="feedback">${data.feedback}</div>
    <div class="btn-row">
      ${data.passed ? `
        <button class="btn btn-success" onclick="closeModalAndNext()">
          ${data.is_last ? 'Certificat final' : data.is_last_sub ? 'Lecon suivante' : 'Sous-lecon suivante'}
        </button>
      ` : `
        <button class="btn btn-secondary" onclick="closeModal()">Reecouter et reessayer</button>
      `}
    </div>
  `;
  modalOverlay.classList.add('show');
  document.getElementById('status-text').textContent = data.passed ? 'Reussi !' : 'A reessayer';
  quizSection.style.display = 'none';
  if (data.passed) {
    const s = loadState();
    if (s) {
      const entry = [currentLesson.lesson_idx, currentLesson.sub_idx];
      const exists = s.passed.some(p => p[0] === entry[0] && p[1] === entry[1]);
      if (!exists) s.passed.push(entry);
      saveState(s);
    }
    renderSidebar();
  }
}

window.closeModal = () => { modalOverlay.classList.remove('show'); };
window.closeModalAndNext = async () => {
  modalOverlay.classList.remove('show');
  const res = await fetch('/api/navigate', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({direction: 'next'})
  });
  if (!res.ok) return;
  const data = await res.json();
  if (data.done) { showCertificate(); return; }
  await loadLesson();
};

async function restartApp() {
  modalOverlay.classList.remove('show');
  clearState();
  await fetch('/api/restart', {method: 'POST'});
  registerOverlay.classList.remove('hidden');
}

// ---- chat ----
sendBtn.onclick = async () => {
  const question = chatInput.value.trim();
  if (!question) return;

  sendBtn.disabled = true;
  sendBtn.textContent = 'Envoi...';
  chatBox.innerHTML += `<div class="msg-user">Vous : ${escapeHtml(question)}</div>`;
  chatBox.scrollTop = chatBox.scrollHeight;
  chatInput.value = '';

  const res = await fetch('/api/ask', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({question})
  });
  const data = await res.json();
  chatBox.innerHTML += `<div class="msg-bot">Professeur : ${escapeHtml(data.response)}</div>`;
  chatBox.scrollTop = chatBox.scrollHeight;
  sendBtn.disabled = false;
  sendBtn.textContent = 'Envoyer';
};

chatInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendBtn.click(); }
});
chatInput.addEventListener('paste', (e) => {
  e.preventDefault();
  const text = (e.clipboardData || window.clipboardData).getData('text/plain');
  chatInput.setRangeText(text, chatInput.selectionStart, chatInput.selectionEnd, 'end');
});

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

// ---- certificate ----
function showCertificate() {
  const fullName = getStudentName();
  modalContent.innerHTML = `
    <div class="certificate">
      <h2>FELICITATIONS !</h2>
      <p style="font-weight:700;color:#cdd6f4;margin:8px 0;font-size:16px" class="student-name">
        ${escapeHtml(fullName)}
      </p>
      <p>Vous avez reussi l'integralite du manuel :</p>
      <p style="font-weight:700;color:#cdd6f4;margin:8px 0">
        Procedure penale - Edouard Verny (6e ed., Dalloz)
      </p>
      <p>Toutes les sous-lecons sont reussies !</p>
      <p style="margin-top:16px;color:#cdd6f4">
        Ce certificat atteste que vous avez parcouru et reussi<br>
        l'ensemble du programme.
      </p>
    </div>
    <div class="btn-row" style="justify-content:center;margin-top:16px">
      <button class="btn" onclick="window.print()">Imprimer en PDF</button>
      <button class="btn btn-secondary" onclick="restartApp()">Recommencer</button>
    </div>
  `;
  modalOverlay.classList.add('show');
}

// ---- misc ----
async function checkServer() {
  try {
    const res = await fetch('/api/check-server');
    const data = await res.json();
    const el = document.getElementById('server-status');
    el.textContent = data.available ? 'IA: OK' : 'IA: mots-cles';
    el.style.color = data.available ? '#2e7d32' : '#e65100';
  } catch {}
}
checkServer();

document.getElementById('fullscreen-btn').onclick = () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
};

const sidebar = document.getElementById('sidebar');
const sidebarOverlay = document.getElementById('sidebar-overlay');
if (window.innerWidth <= 768) sidebar.classList.add('closed');
window.addEventListener('resize', () => {
  if (window.innerWidth > 768) sidebar.classList.remove('closed');
  else sidebar.classList.add('closed');
});
document.getElementById('menu-btn').onclick = () => {
  sidebar.classList.remove('closed');
  sidebarOverlay.classList.add('show');
};
const closeSidebar = () => {
  sidebar.classList.add('closed');
  sidebarOverlay.classList.remove('show');
};
document.getElementById('sidebar-close').onclick = closeSidebar;
sidebarOverlay.onclick = closeSidebar;

init();
</script>
</body>
</html>
